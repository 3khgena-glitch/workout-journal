<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Журнал тренировок">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <title>Журнал тренировок</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">ЖУРНАЛ</div>
        <h1>Тренировки</h1>
      </div>
      <button class="icon-btn" id="installHintBtn" title="Установка" aria-label="Установка">⌂</button>
    </header>

    <main id="main" class="main">
      <section id="view-week" class="view active">
        <div class="section-head">
          <div>
            <h2>Неделя</h2>
            <div id="weekRange" class="muted"></div>
          </div>
          <div class="row gap8">
            <button class="secondary small" id="prevWeek">‹</button>
            <button class="secondary small" id="todayWeek">Сегодня</button>
            <button class="secondary small" id="nextWeek">›</button>
          </div>
        </div>
        <div id="weekList" class="stack"></div>
      </section>

      <section id="view-workouts" class="view">
        <div class="section-head">
          <h2>Тренировки</h2>
          <button class="primary" id="addWorkoutBtn">+ Тренировка</button>
        </div>
        <div id="workoutList" class="stack"></div>
      </section>

      <section id="view-exercises" class="view">
        <div class="section-head">
          <h2>Упражнения</h2>
          <button class="primary" id="addExerciseBtn">+ Упражнение</button>
        </div>
        <input id="exerciseSearch" class="input search" placeholder="Поиск упражнений">
        <div id="exerciseList" class="stack"></div>
      </section>

      <section id="view-history" class="view">
        <div class="section-head">
          <h2>История</h2>
          <button class="secondary small" id="clearHistoryBtn">Очистить</button>
        </div>
        <div id="historyList" class="stack"></div>
      </section>
    </main>

    <nav class="tabbar">
      <button class="tab active" data-view="week">Неделя</button>
      <button class="tab" data-view="workouts">Тренировки</button>
      <button class="tab" data-view="exercises">Упражнения</button>
      <button class="tab" data-view="history">История</button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
