<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Журнал тренувань"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="stylesheet" href="styles.css"><title>Журнал тренувань</title></head><body><div id="app"><header class="top"><div><small>ЖУРНАЛ</small><h1>Тренування</h1></div><button id="installHint" class="icon">⌂</button></header><main>
<section id="view-week" class="view active"><div class="head"><div><h2>Тиждень</h2><div class="meta">План тренувань за днями</div></div><button id="todayWeek" class="secondary small">Сьогодні</button></div><div id="weekNav" class="weeknav"><button id="prevWeek">‹</button><b id="weekTitle"></b><button id="nextWeek">›</button></div><div id="weekList" class="stack"></div></section>
<section id="view-month" class="view"><div class="head"><div><h2>Місяць</h2><div class="meta">Виконані тренування</div></div><button id="monthToday" class="secondary small">Сьогодні</button></div><div class="monthnav"><button id="prevMonth">‹</button><b id="monthTitle"></b><button id="nextMonth">›</button></div><div class="month-weekdays"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Нд</span></div><div id="monthGrid" class="month-grid"></div></section>
<section id="view-workouts" class="view"><div class="head"><div><h2>Тренування</h2><div class="meta">Довідник тренувань. Видалення з календаря не видаляє тренування з довідника.</div></div><button id="addWorkout" class="primary">+ Додати</button></div><input id="workoutSearch" class="input" placeholder="Пошук тренування" autocomplete="off"><div id="workoutList" class="stack"></div></section>
<section id="view-exercises" class="view"><div class="head"><div><h2>Вправи</h2><div class="meta">Довідник вправ</div></div><button id="addExercise" class="primary">+ Додати</button></div><input id="exerciseSearch" class="input" placeholder="Пошук вправи"><div id="exerciseList" class="stack"></div></section>
<section id="view-timers" class="view"><div class="head"><h2>Таймери</h2><button id="soundToggle" class="secondary">Звук: Вкл</button></div><div class="timer-tabs"><button data-timer="stopwatch" class="active">Етап</button><button data-timer="rest">Відпочинок</button><button data-timer="interval">Інтервали</button></div><div id="timerPanel"></div></section>
</main><nav class="tabs"><button class="tab active" data-view="week">Тиждень</button><button class="tab" data-view="month">Місяць</button><button class="tab" data-view="workouts">Тренування</button><button class="tab" data-view="exercises">Вправи</button><button class="tab" data-view="timers">Таймери</button></nav></div><div id="modalRoot"></div><div id="toast" class="toast"></div><script src="app.js"></script></body></html>
