<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Журнал тренировок"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="stylesheet" href="styles.css"><title>Журнал тренировок</title></head><body><div id="app"><header class="top"><div><small>ЖУРНАЛ</small><h1>Тренировки</h1></div><button id="installHint" class="icon">⌂</button></header><main>
<section id="view-workouts" class="view active"><div class="head"><h2>Тренировки</h2><button id="addWorkout" class="primary">+ Тренировка</button></div><div id="weekNav" class="weeknav"><button id="prevWeek">‹</button><b id="weekTitle"></b><button id="nextWeek">›</button></div><div id="weekList" class="stack"></div></section>
<section id="view-exercises" class="view"><div class="head"><h2>Упражнения</h2><button id="addExercise" class="primary">+ Упражнение</button></div><input id="exerciseSearch" class="input" placeholder="Поиск"><div id="exerciseList" class="stack"></div></section>
<section id="view-timers" class="view"><div class="head"><h2>Таймеры</h2><button id="soundToggle" class="secondary">Звук: Вкл</button></div><div class="timer-tabs"><button data-timer="stopwatch" class="active">Этап</button><button data-timer="rest">Отдых</button><button data-timer="interval">Интервалы</button></div><div id="timerPanel"></div></section>
</main><nav class="tabs"><button class="tab active" data-view="workouts">Тренировки</button><button class="tab" data-view="exercises">Упражнения</button><button class="tab" data-view="timers">Таймеры</button></nav></div><div id="modalRoot"></div><div id="toast" class="toast"></div><script src="app.js"></script></body></html>
